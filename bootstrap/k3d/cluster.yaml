# k3d cluster definition for the POC — the cluster itself is infrastructure as code.
# Recreate at any time with:  k3d cluster delete -c bootstrap/k3d/cluster.yaml && make cluster-up
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: krakend-poc
servers: 1
agents: 1
# Pin the k3s version so every engineer gets the same Kubernetes.
image: docker.io/rancher/k3s:v1.35.5-k3s1
ports:
  # Traefik (the ingress controller bundled with k3s) is reachable on localhost:8080 / :8443
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 300s
    disableLoadbalancer: false
  k3s:
    extraArgs:
      # Keep the Traefik ingress controller and ServiceLB that k3s ships with:
      # ServiceLB is what makes the ports above reach Traefik.
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
