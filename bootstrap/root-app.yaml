# The one and only thing applied by hand (see `make bootstrap`).
# From here on, everything in clusters/poc/ is managed by Argo CD from Git:
# this is the "app of apps" pattern.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/taroninak/krakend-gitops.git
    targetRevision: main
    path: clusters/poc
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
