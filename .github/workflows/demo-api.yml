# Builds the demo-api image and publishes it to GHCR.
#
# The tag is the version in services/demo-api/package.json, and a published
# version is never overwritten: change the code or the data, bump the version,
# and point apps/demo-api/values.yaml at it — all in one commit. Argo CD may roll out
# before this job finishes; the new pods simply retry the pull until the image
# exists, while the old ones keep serving.
name: demo-api image

on:
  push:
    branches: [main]
    paths:
      - services/demo-api/src/**
      - services/demo-api/data/**
      - services/demo-api/package.json
      - services/demo-api/package-lock.json
      - services/demo-api/Dockerfile
      - .github/workflows/demo-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version to publish
        id: version
        run: echo "version=$(node -p "require('./services/demo-api/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are immutable here: a running cluster pinned to 1.0.0 must never
      # have 1.0.0 change underneath it.
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.version }} is already published. Bump the version in services/demo-api/package.json."
            exit 1
          fi

      # The kind nodes on an Apple-silicon Mac are arm64; CI runners are amd64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: services/demo-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Upstream services behind the KrakenD gateway POC
