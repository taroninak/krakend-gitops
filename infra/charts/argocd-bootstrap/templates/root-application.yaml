# The "app of apps": Argo CD renders clusters/poc as a Helm chart and creates
# one Application per workload from it. The repository URL is passed down as a
# chart parameter, so it is configured in exactly one place — Terraform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Values.argocdNamespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.path | quote }}
    helm:
      parameters:
        - name: repoURL
          value: {{ .Values.repoURL | quote }}
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocdNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
