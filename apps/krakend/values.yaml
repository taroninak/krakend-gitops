# Deployment settings for the gateway.
#
# The gateway configuration itself is NOT here — it lives in
# config/krakend.json as ordinary JSON, so editors, `jq` and `krakend check`
# all understand it. The chart loads that file into a ConfigMap and hashes it
# into the pod annotations, so editing it rolls the pods.

replicaCount: 2

image:
  repository: devopsfaith/krakend
  tag: "2.9.4"
  pullPolicy: IfNotPresent

# Path of the config file inside the chart, and where it is mounted.
config:
  file: config/krakend.json
  mountPath: /etc/krakend

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
