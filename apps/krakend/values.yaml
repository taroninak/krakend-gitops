# Deployment settings for the gateway.
#
# The gateway configuration itself is NOT here — it lives under config/ as
# ordinary JSON files, so editors, `jq` and `krakend check` all understand it.
# The chart assembles them into the single file KrakenD reads and hashes the
# result into the pod annotations, so editing any of them rolls the pods.

replicaCount: 2

image:
  repository: devopsfaith/krakend
  tag: "2.9.4"
  pullPolicy: IfNotPresent

# The configuration sources, and where the assembled file is mounted.
# Adding an endpoint group means dropping another file into config/endpoints/.
config:
  fileName: krakend.json
  serviceFile: config/service.json
  endpointsGlob: config/endpoints/*.json
  mountPath: /etc/krakend

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
