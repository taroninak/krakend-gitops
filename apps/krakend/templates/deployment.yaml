apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krakend.name" . }}
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "krakend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods whenever the gateway configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "krakend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "krakend.name" . }}
      # Kubernetes injects legacy service-link variables for every Service in the
      # namespace: the one for this Service is KRAKEND_PORT=tcp://<ip>:<port>,
      # which KrakenD reads as an override for its own `port` setting and then
      # fails to parse. Turning the links off removes the collision entirely.
      enableServiceLinks: false
      containers:
        - name: krakend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/krakend"]
          args:
            - "run"
            - "-c"
            - "{{ .Values.config.mountPath }}/{{ include "krakend.configFileName" . }}"
            - "-p"
            - {{ .Values.service.targetPort | quote }}
          env:
            # Belt and braces: set it explicitly so the value is right even if
            # service links are re-enabled.
            - name: KRAKEND_PORT
              value: {{ .Values.service.targetPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /__health, port: http}
          readinessProbe:
            httpGet: {path: /__health, port: http}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "krakend.name" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
