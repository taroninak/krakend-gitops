# Defaults. Each instance supplies its own values file
# (values-users.yaml / values-orders.yaml) via the Argo CD Application.

nameOverride: ""
replicaCount: 1

image:
  repository: node
  # Current LTS. The server uses Node's standard library only, so any LTS works.
  tag: "24-alpine"
  pullPolicy: IfNotPresent

service:
  port: 8080

# Fixed JSON documents at fixed paths. `exact: true` matches the path only,
# otherwise it matches the path and anything below it.
routes: []

# Id-addressable objects. Served one at a time at <path>/<id> and several at
# once at <path>?ids=a,b,c — the batch form is what lets a gateway fetch many
# records without one call per id.
records: {}
#  path: /users
#  key: customer_id
#  collectionKey: customers
#  items: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
