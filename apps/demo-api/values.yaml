# Deploys demo-api: one Deployment and one Service. What it does and the data it
# serves both live in services/demo-api/ and ship together in the image.

nameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/taroninak/demo-api
  # The version in services/demo-api/package.json. CI publishes it and never
  # overwrites a published version, so this pin always means the same code.
  tag: "1.2.2"
  pullPolicy: IfNotPresent


containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
