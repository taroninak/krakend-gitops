# Defaults. Each instance supplies its own values file (values-users.yaml,
# values-orders.yaml, values-events.yaml) via the Argo CD Application.
#
# Code and data change for different reasons, so they ship differently:
#   code  services/demo-api/      built into the image by CI — bump the version
#   data  apps/demo-api/data/     mounted from a ConfigMap — just commit it

nameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/taroninak/demo-api
  # The version in services/demo-api/package.json. CI publishes it and never
  # overwrites a published version, so this pin always means the same code.
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Which router the app mounts: users, orders or events.
service: ""

# The JSON document this instance serves, relative to this chart.
dataFile: ""

containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
