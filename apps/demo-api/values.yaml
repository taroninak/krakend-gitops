# Defaults. Each instance supplies its own values file (values-users.yaml,
# values-orders.yaml, values-events.yaml) via the Argo CD Application.
#
# This chart only deploys demo-api. What the services do and what data they
# serve both live in services/demo-api/ and ship together in the image.

nameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/taroninak/demo-api
  # The version in services/demo-api/package.json. CI publishes it and never
  # overwrites a published version, so this pin always means the same code.
  tag: "1.2.0"
  pullPolicy: IfNotPresent


containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
