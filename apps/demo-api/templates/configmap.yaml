# Everything the service needs: the script (a static file in this chart) and the
# data (whatever the instance's values file declares, rendered to JSON).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-api.name" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
data:
  server.js: |
{{ .Files.Get "files/server.js" | indent 4 }}
  data.json: |
{{ pick .Values "routes" "records" | toPrettyJson | indent 4 }}
