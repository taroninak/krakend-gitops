# nginx serves each route straight from its config: no application, no image
# build, and the response bodies live in Git next to everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-api.name" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.service.port }};
      server_name _;
      default_type application/json;

      location = /healthz {
        return 200 '{"status":"ok"}';
      }
      {{- range .Values.routes }}

      {{- if .exact }}
      # Exactly {{ .path }} — nothing below it.
      location = {{ .path }} {
      {{- else }}
      # {{ .path }} and anything below it.
      location {{ .path }} {
      {{- end }}
        return 200 '{{ toJson .response }}';
      }
      {{- end }}
    }
