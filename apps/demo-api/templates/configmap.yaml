# The data this instance serves, straight from apps/demo-api/data/. Editing that
# file changes this ConfigMap, whose checksum rolls the pods — no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-api.name" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
data:
  data.json: |
{{ required "dataFile is required" .Values.dataFile | .Files.Get | indent 4 }}
