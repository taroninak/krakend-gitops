nameOverride: users-api

# The id list the gateway reads first. When a whole array is substituted into a
# {resp0_...} placeholder, KrakenD 2.9 joins it with commas, so the follow-up is a
# single /users?ids=42,43,44,45 call however many ids there are.
routes:
  - path: /customer-ids
    exact: true
    response:
      segment: gold
      count: 4
      ids: ["42", "43", "44", "45"]

# Five people on file; the id list above asks for four of them, so the batch
# response proves it filters rather than returning everything.
records:
  path: /users
  key: customer_id
  collectionKey: customers
  items:
    - customer_id: "42"
      name: Ada Lovelace
      email: ada@example.com
      tier: gold
    - customer_id: "43"
      name: Grace Hopper
      email: grace@example.com
      tier: gold
    - customer_id: "44"
      name: Alan Turing
      email: alan@example.com
      tier: silver
    - customer_id: "45"
      name: Katherine Johnson
      email: katherine@example.com
      tier: gold
    - customer_id: "46"
      name: Edsger Dijkstra
      email: edsger@example.com
      tier: bronze
