nameOverride: users-api

# The id list the gateway reads first. ids_csv is pre-joined because KrakenD's
# sequential proxy substitutes one scalar per placeholder — handing it a ready
# made list means the gateway needs exactly one follow-up call regardless of how
# many ids there are.
routes:
  - path: /customer-ids
    exact: true
    response:
      segment: gold
      count: 4
      ids_csv: "42,43,44,45"

# Five people on file; the id list above asks for four of them, so the batch
# response proves it filters rather than returning everything.
records:
  path: /users
  key: customer_id
  collectionKey: customers
  items:
    - customer_id: "42"
      name: Ada Lovelace
      email: ada@example.com
      tier: gold
    - customer_id: "43"
      name: Grace Hopper
      email: grace@example.com
      tier: gold
    - customer_id: "44"
      name: Alan Turing
      email: alan@example.com
      tier: silver
    - customer_id: "45"
      name: Katherine Johnson
      email: katherine@example.com
      tier: gold
    - customer_id: "46"
      name: Edsger Dijkstra
      email: edsger@example.com
      tier: bronze
