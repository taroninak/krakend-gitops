# The page itself is a static file (files/index.html); only the endpoint
# addresses come from values, injected as a tiny config.js so the HTML stays
# free of templating.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portal.name" . }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
data:
  config.js: |
    window.PORTAL_CONFIG = {{ toJson .Values.oidc }};
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
  default.conf: |
    # ingress-nginx routes the gateway's 401s here (custom-http-errors +
    # default-backend annotations on the KrakenD ingress) and describes the
    # original request with X-* headers.
    #
    # A browser should be offered the login page; an API client should keep its
    # honest 401. nginx `if` cannot AND two conditions, so the decision is made
    # in a map, which is legal here because conf.d files are included inside the
    # http context.
    map "$http_x_code::$http_x_format" $send_to_login {
      default                     0;
      "~^401::.*text/html"        1;
    }

    map $http_x_code $upstream_said_401 {
      default   0;
      "401"     1;
    }

    server {
      listen {{ .Values.service.port }};
      server_name _;
      # The base image sets this in the default.conf this file replaces, so it
      # has to be declared here or try_files resolves against the wrong root.
      root /usr/share/nginx/html;

      location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
      }

      location = /login/config.js {
        default_type application/javascript;
        alias /usr/share/nginx/html/config.js;
      }

      # /login and /callback are the same single-page document; the script
      # decides what to do from location.pathname.
      location / {
        # Unauthenticated browser navigation: send them somewhere useful.
        if ($send_to_login) {
          return 302 /login?next=$http_x_original_uri;
        }
        # Unauthenticated API call: pass the gateway's answer through unchanged.
        if ($upstream_said_401) {
          return 401;
        }
        default_type text/html;
        try_files /index.html =404;
      }

      # Anything else on these paths (favicon, etc.) should not fall through
      # to the gateway; a 404 from here is the honest answer.
    }
