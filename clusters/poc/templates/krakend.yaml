# KrakenD API gateway, installed from the community Helm chart.
#
# Two sources: the chart comes from its upstream Git repository (pinned to a
# commit), the values come from this repository via the `$values` reference.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: krakend
  namespace: {{ .Values.argocdNamespace }}
spec:
  project: poc
  sources:
    - repoURL: {{ .Values.krakend.chartRepo | quote }}
      targetRevision: {{ .Values.krakend.chartRef | quote }}
      path: .
      helm:
        releaseName: krakend
        valueFiles:
          - $values/apps/krakend/values.yaml
    - repoURL: {{ .Values.repoURL | quote }}
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.krakend.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
