# The KrakenD API gateway.
#
# Chart and configuration both live in this repository: apps/krakend/ holds a
# small chart, and the gateway config is the plain JSON file it mounts
# (apps/krakend/config/krakend.json).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: krakend
  namespace: {{ .Values.argocdNamespace }}
spec:
  project: poc
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: apps/krakend
    helm:
      releaseName: krakend
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.krakend.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
