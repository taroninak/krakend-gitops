# Argo CD manages its own installation from Git.
# Terraform installs it once (infra/main.tf) to break the chicken-and-egg
# problem; from here on, changes to platform/argocd/values.yaml are rolled out
# by Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Values.argocdNamespace }}
spec:
  project: poc
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: {{ .Values.argocdChartVersion | quote }}
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: {{ .Values.repoURL | quote }}
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocdNamespace }}
  syncPolicy:
    automated:
      # Never prune Argo CD's own resources automatically.
      prune: false
      selfHeal: true
    syncOptions:
      # Argo CD's CRDs are too large for the client-side last-applied annotation.
      - ServerSideApply=true
      - CreateNamespace=true
