# A stand-in upstream API so the gateway has something real to route to.
# Replace with your own services when the POC graduates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpbin
  namespace: argocd
spec:
  project: poc
  source:
    repoURL: https://github.com/taroninak/krakend-gitops.git
    targetRevision: main
    path: apps/httpbin
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
