apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poc
  namespace: argocd
spec:
  description: KrakenD GitOps proof of concept
  sourceRepos:
    - https://github.com/taroninak/krakend-gitops.git
    - https://github.com/krakend/contrib-helm-chart.git
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: gateway
    - server: https://kubernetes.default.svc
      namespace: demo
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
