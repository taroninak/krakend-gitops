# repoURL and targetRevision are passed in by the root Application, which
# Terraform creates from infra/terraform.tfvars — so the Git URL is configured
# in exactly one place and every child Application inherits it.
repoURL: ""
targetRevision: main

argocdNamespace: argocd

# Argo CD's own chart version. Keep in sync with infra/variables.tf; the value
# there is used for the initial install, this one for every sync afterwards.
argocdChartVersion: "10.4.0"

krakend:
  namespace: gateway

# Where demo-api — every upstream route the gateway calls — runs.
demoApiNamespace: demo

keycloak:
  namespace: iam
