# Argo CD manages its own installation from Git.
# `make argocd-install` only exists to break the chicken-and-egg problem at
# cluster creation time; after this Application syncs, changes to
# platform/argocd/values.yaml are rolled out by Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: poc
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/taroninak/krakend-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Never prune Argo CD's own resources automatically.
      prune: false
      selfHeal: true
    syncOptions:
      # Argo CD's CRDs are too large for the client-side last-applied annotation.
      - ServerSideApply=true
      - CreateNamespace=true
