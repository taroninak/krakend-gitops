# Argo CD Helm values.
#
# This single file is used twice, on purpose:
#   1. by `make argocd-install`, which bootstraps Argo CD with the Helm CLI, and
#   2. by clusters/poc/argocd.yaml, the Application through which Argo CD
#      manages its own installation from Git afterwards.
#
# Chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

global:
  domain: argocd.localhost

crds:
  install: true
  keep: false

configs:
  params:
    # Terminate TLS at the ingress; the API server itself speaks plain HTTP.
    # POC only — put real TLS in front of Argo CD for anything shared.
    server.insecure: true
  cm:
    url: http://argocd.localhost:8080
    # Reconcile quickly so drift and new commits show up during the demo.
    timeout.reconciliation: 30s
    # Track resources by annotation instead of label: survives renames and
    # avoids the 63-char label limit.
    application.resourceTrackingMethod: annotation
  rbac:
    policy.default: role:readonly

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
    path: /
    pathType: Prefix
    tls: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 1Gi}

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

applicationSet:
  enabled: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

# Not needed for the POC — keeps the cluster small.
dex:
  enabled: false
notifications:
  enabled: false

redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
